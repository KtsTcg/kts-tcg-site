<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTS TCG — Fiche carte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #1B2A22;
    --ink-2: #223328;
    --parchment: #EFE6D3;
    --parchment-dim: #E0D5BC;
    --brass: #C08A3E;
    --brass-light: #D9AC6B;
    --ember: #B5432F;
    --moss: #5C7A5E;
    --line: rgba(239,230,211,0.18);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    background: var(--ink);
    color: var(--parchment);
    font-family:'IBM Plex Sans', sans-serif;
    line-height:1.6;
  }
  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:600; letter-spacing:-0.01em; }
  a{ color:inherit; text-decoration:none; }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  .wrap{ max-width:900px; margin:0 auto; padding:48px 28px 100px; }
  .back-link{ display:inline-block; margin-bottom:32px; color:var(--brass-light); font-family:'IBM Plex Mono',monospace; font-size:13px; }
  .back-link:hover{ color:var(--brass); }
  .product{ display:grid; grid-template-columns:1fr; gap:32px; }
  @media(min-width:720px){ .product{ grid-template-columns:1fr 1fr; } }
  .photo-box{
    background:var(--ink-2); border:1px solid var(--line); border-radius:6px;
    display:flex; align-items:center; justify-content:center; min-height:320px; overflow:hidden;
  }
  .photo-box img{ width:100%; height:100%; object-fit:cover; }
  .photo-box .stamp-fallback{ font-size:5rem; }
  .tag{ font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--brass-light); border:1px solid var(--line); display:inline-block; padding:4px 10px; border-radius:100px; margin-bottom:14px; }
  h1{ font-size:2rem; margin-bottom:12px; }
  .price{ font-family:'IBM Plex Mono',monospace; font-size:1.4rem; color:var(--brass-light); margin-bottom:20px; }
  .desc{ color:var(--parchment-dim); margin-bottom:28px; }
  .btn{
    display:inline-block; background:var(--brass); color:var(--ink); font-weight:600;
    padding:13px 26px; border-radius:2px; border:none; cursor:pointer; font-size:15px;
  }
  .btn:hover{ background:var(--brass-light); }
  .loading, .not-found{ color:var(--parchment-dim); font-style:italic; }
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html#boutique" class="back-link">&larr; Retour au comptoir</a>
  <div id="content"><p class="loading">Chargement de la fiche…</p></div>
</div>

<script>
const CATALOG_API = 'https://verifai-8ud0.onrender.com/api/catalog';
const params = new URLSearchParams(window.location.search);
const id = params.get('id');

fetch(CATALOG_API)
  .then(r => r.json())
  .then(items => {
    const item = items.find(it => it.id === id);
    const el = document.getElementById('content');
    if(!item){
      el.innerHTML = '<p class="not-found">Cette carte n\'est plus disponible ou a été retirée du catalogue.</p>';
      return;
    }
    el.innerHTML = `
      <div class="product">
        <div class="photo-box">
          ${item.image ? `<img src="${item.image}">` : `<div class="stamp-fallback">${item.emoji || '🃏'}</div>`}
        </div>
        <div>
          ${item.category ? `<div class="tag">${item.category}</div>` : ''}
          <h1>${item.name}</h1>
          <div class="price">${item.price}</div>
          <p class="desc">${item.description || 'Aucune description fournie pour cette pièce.'}</p>
          <a href="index.html#depot-vente" class="btn">Voir le comptoir de dépôt-vente</a>
        </div>
      </div>
    `;
  })
  .catch(() => {
    document.getElementById('content').innerHTML = '<p class="not-found">Impossible de charger cette fiche pour le moment.</p>';
  });
</script>
</body>
</html>
